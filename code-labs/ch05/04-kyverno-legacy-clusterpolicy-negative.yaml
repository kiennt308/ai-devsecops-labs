apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: legacy-verify-images-clusterpolicy
spec:
  validationFailureAction: Enforce
  rules:
    - name: verify-legacy-cosign-v2
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "registry.orderflow.internal/*"
          attestors:
            - count: 1
              entries:
                - keys:
                    publicKeys: "legacy-v2-inline-key"
